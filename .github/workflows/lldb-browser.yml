name: LLDB browser producer contracts

on:
    schedule:
        - cron: '17 4 * * 1'
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            build_product:
                description: Build and upload the pinned LLDB and WAMR browser products
                required: true
                type: boolean
                default: false
            native_baseline:
                description: Run the pinned native LLVM/WAMR C and DAP baselines
                required: true
                type: boolean
                default: false
            build_clang:
                description: Build and verify fresh WASI Clang, LLD, MemFS, sysroot and browser clangd artifacts
                required: true
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    producer-contracts:
        concurrency:
            group: lldb-browser-contracts-${{ github.ref }}
            cancel-in-progress: true
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: node --test producer/lldb-browser/test/producer.test.mjs producer/wamr-browser/test/*.test.mjs test/debug-release.test.mjs test/lldb-browser-ci.test.mjs
            - run: node --test test/clang-language-sysroots.test.mjs test/rust-sysroot-profiles.test.mjs producer/rust-browser/test/crate-registry.test.mjs
            - run: node --test test/clang-build-options.test.mjs test/clangd-headers.test.mjs test/clangd-artifact-contract.test.mjs test/clang-sysroot-pruning.test.mjs test/clang-toolchain.test.mjs test/clang-memfs*.test.mjs

    clang-artifact-provenance:
        concurrency:
            group: lldb-clang-artifact-provenance-${{ github.ref }}
            cancel-in-progress: true
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm verify:clang-artifacts
            - run: pnpm smoke:clang-artifacts

    runtime-source-provenance:
        concurrency:
            group: lldb-runtime-source-provenance-${{ github.ref }}
            cancel-in-progress: true
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: node --test test/debug-runtime-source.test.mjs

    build-product:
        needs: producer-contracts
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build_product)
        concurrency:
            group: lldb-browser-product-${{ github.ref }}
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 360
        env:
            LLDB_PRODUCT_WORK: artifacts/lldb-browser-build-a
            LLDB_REPRO_WORK: artifacts/lldb-browser-build-b
            LLDB_PRODUCT_OUTPUT: artifacts/lldb-browser
            LLDB_REPRO_OUTPUT: artifacts/lldb-browser-repro
            LLDB_EMSDK: artifacts/lldb-browser-toolchain/emsdk
            WAMR_PRODUCT_REPOSITORY: https://github.com/bytecodealliance/wasm-micro-runtime.git
            WAMR_PRODUCT_COMMIT: 25bd7eb63e828e4bd242cc9b38d260b4b31c6605
            WAMR_PRODUCT_SOURCE: artifacts/wamr-browser-build/wasm-micro-runtime
            WAMR_PRODUCT_BUILD: artifacts/wamr-browser-build/build
            WAMR_REPRO_SOURCE: artifacts/wamr-browser-repro-build/wasm-micro-runtime
            WAMR_REPRO_BUILD: artifacts/wamr-browser-repro-build/build
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Report available disk
              run: df -h .
            - name: Prepare primary pinned LLVM build
              run: |
                  node producer/lldb-browser/scripts/prepare.mjs \
                    --work-dir "$LLDB_PRODUCT_WORK" \
                    --emsdk-dir "$LLDB_EMSDK"
            - name: Build and package primary LLDB browser assets
              env:
                  NINJA_JOBS: 2
              run: |
                  node producer/lldb-browser/scripts/build.mjs \
                    --work-dir "$LLDB_PRODUCT_WORK" \
                    --emsdk-dir "$LLDB_EMSDK" \
                    --out-dir "$LLDB_PRODUCT_OUTPUT"
            - name: Verify primary LLDB browser assets
              run: node producer/lldb-browser/scripts/verify.mjs "$LLDB_PRODUCT_OUTPUT"
            - name: Release primary LLDB build workspace
              run: find artifacts/lldb-browser-build-a -xdev -depth -delete
            - name: Prepare independent pinned LLVM build
              run: |
                  node producer/lldb-browser/scripts/prepare.mjs \
                    --work-dir "$LLDB_REPRO_WORK" \
                    --emsdk-dir "$LLDB_EMSDK" \
                    --skip-emsdk-install
            - name: Build independent LLDB reproducibility package
              env:
                  NINJA_JOBS: 2
              run: |
                  node producer/lldb-browser/scripts/build.mjs \
                    --work-dir "$LLDB_REPRO_WORK" \
                    --emsdk-dir "$LLDB_EMSDK" \
                    --out-dir "$LLDB_REPRO_OUTPUT"
            - name: Verify clean LLDB build reproducibility
              run: |
                  node producer/lldb-browser/scripts/verify-reproducibility.mjs \
                    "$LLDB_PRODUCT_OUTPUT" \
                    "$LLDB_REPRO_OUTPUT"
            - name: Release independent LLDB build workspace
              run: find artifacts/lldb-browser-build-b -xdev -depth -delete
            - name: Prepare pinned WAMR browser sources
              run: |
                  mkdir -p artifacts/wamr-browser-build artifacts/wamr-browser-repro-build
                  git init "$WAMR_PRODUCT_SOURCE"
                  git -C "$WAMR_PRODUCT_SOURCE" remote add origin "$WAMR_PRODUCT_REPOSITORY"
                  git -C "$WAMR_PRODUCT_SOURCE" fetch --depth 1 origin "$WAMR_PRODUCT_COMMIT"
                  git -C "$WAMR_PRODUCT_SOURCE" checkout --detach FETCH_HEAD
                  test "$(git -C "$WAMR_PRODUCT_SOURCE" rev-parse HEAD)" = "$WAMR_PRODUCT_COMMIT"
                  node producer/wamr-browser/scripts/prepare.mjs --source "$WAMR_PRODUCT_SOURCE"
                  git init "$WAMR_REPRO_SOURCE"
                  git -C "$WAMR_REPRO_SOURCE" remote add origin "$WAMR_PRODUCT_REPOSITORY"
                  git -C "$WAMR_REPRO_SOURCE" fetch --depth 1 origin "$WAMR_PRODUCT_COMMIT"
                  git -C "$WAMR_REPRO_SOURCE" checkout --detach FETCH_HEAD
                  test "$(git -C "$WAMR_REPRO_SOURCE" rev-parse HEAD)" = "$WAMR_PRODUCT_COMMIT"
                  node producer/wamr-browser/scripts/prepare.mjs --source "$WAMR_REPRO_SOURCE"
            - name: Build and package WAMR browser assets
              run: |
                  node producer/wamr-browser/scripts/build.mjs \
                    --source "$WAMR_PRODUCT_SOURCE" \
                    --build "$WAMR_PRODUCT_BUILD" \
                    --emsdk "$LLDB_EMSDK"
                  node producer/wamr-browser/scripts/package.mjs \
                    --build "$WAMR_PRODUCT_BUILD" \
                    --output artifacts/wamr-browser
            - name: Verify packaged WAMR browser assets
              run: node producer/wamr-browser/scripts/verify.mjs --artifacts artifacts/wamr-browser
            - name: Build independent WAMR reproducibility package
              run: |
                  node producer/wamr-browser/scripts/build.mjs \
                    --source "$WAMR_REPRO_SOURCE" \
                    --build "$WAMR_REPRO_BUILD" \
                    --emsdk "$LLDB_EMSDK"
                  node producer/wamr-browser/scripts/package.mjs \
                    --build "$WAMR_REPRO_BUILD" \
                    --output artifacts/wamr-browser-repro
            - name: Verify clean WAMR build reproducibility
              run: |
                  node producer/wamr-browser/scripts/verify-reproducibility.mjs \
                    artifacts/wamr-browser \
                    artifacts/wamr-browser-repro
            - uses: actions/upload-artifact@v4
              with:
                  name: lldb-wamr-browser-${{ github.sha }}
                  path: |
                      artifacts/lldb-browser
                      artifacts/wamr-browser
                  if-no-files-found: error
                  retention-days: 7

    build-clang:
        needs: producer-contracts
        if: github.event_name == 'workflow_dispatch' && inputs.build_clang
        concurrency:
            group: clang-browser-product-${{ github.ref }}
            cancel-in-progress: false
        runs-on: ubuntu-24.04
        timeout-minutes: 360
        env:
            NINJA_JOBS: '2'
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Install full Clang producer host dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                    build-essential ca-certificates cmake curl git ninja-build python3 tar xz-utils zstd
            - name: Prepare isolated Clang build paths
              run: |
                  mkdir -p "$RUNNER_TEMP/clang-browser-tmp"
                  printf 'WASM_LLVM_TOOLCHAIN_WORK_DIR=%s/clang-browser-work\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
                  printf 'WASM_LLVM_TOOLCHAIN_OUT_DIR=%s/clang-browser-artifacts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
                  printf 'WASM_LLVM_CLANG_ARTIFACT_DIR=%s/clang-browser-artifacts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
                  printf 'TMPDIR=%s/clang-browser-tmp\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
                  printf 'CLANG_BUILD_EVIDENCE=%s/clang-browser-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
            - name: Require capacity for a fresh full toolchain build
              run: |
                  node --input-type=module <<'NODE'
                  import assert from 'node:assert/strict';
                  import fs from 'node:fs/promises';
                  const disk = await fs.statfs(process.env.RUNNER_TEMP);
                  const memory = await fs.readFile('/proc/meminfo', 'utf8');
                  const availableMemory = Number(memory.match(/^MemAvailable:\s+(\d+) kB$/m)?.[1]) * 1024;
                  const availableDisk = disk.bavail * disk.bsize;
                  console.log(JSON.stringify({ availableDisk, availableMemory }));
                  assert(availableDisk >= 20 * 1024 ** 3, 'Clang build needs at least 20 GiB available disk');
                  assert(availableMemory >= 12 * 1024 ** 3, 'Clang build needs at least 12 GiB available memory');
                  for (const directory of [process.env.WASM_LLVM_TOOLCHAIN_WORK_DIR, process.env.WASM_LLVM_TOOLCHAIN_OUT_DIR]) {
                    await assert.rejects(fs.stat(directory), { code: 'ENOENT' });
                  }
                  NODE
            - name: Build all pinned Clang producer outputs
              id: clang-build
              shell: bash
              run: |
                  umask 077
                  mkdir -p "$HOME/logs" "$CLANG_BUILD_EVIDENCE"
                  chmod 700 "$HOME/logs" "$CLANG_BUILD_EVIDENCE"
                  clang_log="$HOME/logs/clang-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
                  clang_status_file="$CLANG_BUILD_EVIDENCE/build.status.json"
                  printf 'log=%s\n' "$clang_log" >> "$GITHUB_OUTPUT"
                  git rev-parse HEAD > "$CLANG_BUILD_EVIDENCE/source-commit.txt"
                  set +e
                  (
                    node producer/clang-browser/scripts/build-toolchain.mjs
                    clang_status=$?
                    printf '{"exitCode":%s}\n' "$clang_status" > "$clang_status_file"
                    exit "$clang_status"
                  ) > "$clang_log" 2>&1 &
                  clang_pid=$!
                  printf '%s\n' "$clang_pid" > "$CLANG_BUILD_EVIDENCE/build.pid"
                  wait "$clang_pid"
                  clang_status=$?
                  set -e
                  tail -n 80 "$clang_log"
                  exit "$clang_status"
            - name: Verify current build receipts and all packaged Wasm assets
              id: clang-verify
              run: |
                  node --input-type=module <<'NODE'
                  import { loadVerifiedClangArtifacts } from './producer/clang-browser/scripts/verify-artifacts.mjs';
                  await loadVerifiedClangArtifacts(process.env.WASM_LLVM_CLANG_ARTIFACT_DIR, { requireBuildReceipt: true });
                  NODE
                  pnpm smoke:clang-artifacts
            - uses: actions/upload-artifact@v4
              if: steps.clang-verify.conclusion == 'success'
              with:
                  name: clang-browser-${{ github.sha }}
                  path: ${{ env.WASM_LLVM_TOOLCHAIN_OUT_DIR }}/
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 7
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: clang-browser-evidence-${{ github.sha }}
                  path: |
                      ${{ steps.clang-build.outputs.log }}
                      ${{ env.CLANG_BUILD_EVIDENCE }}/
                  if-no-files-found: warn
                  retention-days: 7

    native-baseline:
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.native_baseline)
        concurrency:
            group: lldb-native-baseline-${{ github.ref }}
            cancel-in-progress: false
        runs-on: ubuntu-latest
        container:
            image: debian:12.11-slim@sha256:b1a741487078b369e78119849663d7f1a5341ef2768798f7b7406c4240f86aef
        timeout-minutes: 180
        env:
            LLVM_ARCHIVE_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz
            LLVM_ARCHIVE_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
            WASI_SDK_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz
            WASI_SDK_SHA256: 0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce
            WAMR_REPOSITORY: https://github.com/bytecodealliance/wasm-micro-runtime.git
            WAMR_COMMIT: 25bd7eb63e828e4bd242cc9b38d260b4b31c6605
            C_FIXTURE_SHA256: 226c0c142d2430d107927fef8aadd672bb8ed6b3ae1744c539e792bb8475bec3
            TRAP_FIXTURE_SHA256: 6ed12195841585bcbc57ba561f8a2be273cf95ce1f6e564eeb11d2e29e5db126
            INTERRUPT_FIXTURE_SHA256: daa689fe7f83b39bfae4d7e9c0a06943eec05350b72fe95694bf74c135ca9876
            NATIVE_ROOT: /tmp/wasm-native-debug
            LLVM_ROOT: /tmp/wasm-native-debug/llvm
            WASI_ROOT: /tmp/wasm-native-debug/wasi-sdk-33.0-x86_64-linux
            WAMR_ROOT: /tmp/wasm-native-debug/wamr
            PROGRAM_PATH: /tmp/wasm-native-debug/program.wasm
            TRAP_PROGRAM_PATH: /tmp/wasm-native-debug/trap.wasm
            INTERRUPT_PROGRAM_PATH: /tmp/wasm-native-debug/interrupt.wasm
            HIT_COUNT_PROGRAM_PATH: /tmp/wasm-native-debug/hit-count.wasm
            FUNCTION_END_PROGRAM_PATH: /tmp/wasm-native-debug/function-end.wasm
            CONTAINER_ADAPTORS_PROGRAM_PATH: /tmp/wasm-native-debug/container-adaptors.wasm
            NATIVE_FEATURE_ROOT: /tmp/wasm-native-debug/features
            NATIVE_FEATURE_SOURCE: /tmp/wasm-native-debug/features/llvm-project
            NATIVE_FEATURE_BUILD: /tmp/wasm-native-debug/features/build
        steps:
            - name: Install native baseline host dependencies
              run: |
                  apt-get update
                  apt-get install --yes --no-install-recommends \
                    build-essential ca-certificates cmake curl git \
                    libexpat1 libicu72 libncurses6 libpython3.11 libxml2 \
                    lld ninja-build python3 xz-utils zlib1g zlib1g-dev zstd libxml2-dev
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - uses: actions/cache@v4
              with:
                  path: /tmp/wasm-native-debug/downloads
                  key: lldb-native-baseline-llvm-22.1.8-wasi-sdk-33
            - name: Download and verify pinned native toolchains
              run: |
                  mkdir -p "$NATIVE_ROOT/downloads" "$LLVM_ROOT"
                  LLVM_ARCHIVE="$NATIVE_ROOT/downloads/LLVM-22.1.8-Linux-X64.tar.xz"
                  WASI_ARCHIVE="$NATIVE_ROOT/downloads/wasi-sdk-33.0-x86_64-linux.tar.gz"
                  if ! echo "$LLVM_ARCHIVE_SHA256  $LLVM_ARCHIVE" | sha256sum --check --status; then
                    rm -f "$LLVM_ARCHIVE"
                    curl --fail --location --retry 3 "$LLVM_ARCHIVE_URL" --output "$LLVM_ARCHIVE"
                  fi
                  echo "$LLVM_ARCHIVE_SHA256  $LLVM_ARCHIVE" | sha256sum --check
                  if ! echo "$WASI_SDK_SHA256  $WASI_ARCHIVE" | sha256sum --check --status; then
                    rm -f "$WASI_ARCHIVE"
                    curl --fail --location --retry 3 "$WASI_SDK_URL" --output "$WASI_ARCHIVE"
                  fi
                  echo "$WASI_SDK_SHA256  $WASI_ARCHIVE" | sha256sum --check
            - name: Extract the pinned native tools
              run: |
                  LLVM_ARCHIVE="$NATIVE_ROOT/downloads/LLVM-22.1.8-Linux-X64.tar.xz"
                  WASI_ARCHIVE="$NATIVE_ROOT/downloads/wasi-sdk-33.0-x86_64-linux.tar.gz"
                  tar -xJf "$LLVM_ARCHIVE" -C "$LLVM_ROOT" --strip-components=1 \
                    LLVM-22.1.8-Linux-X64/bin/clang \
                    LLVM-22.1.8-Linux-X64/bin/clang-22 \
                    LLVM-22.1.8-Linux-X64/bin/lld \
                    LLVM-22.1.8-Linux-X64/bin/lldb \
                    LLVM-22.1.8-Linux-X64/bin/lldb-dap \
                    LLVM-22.1.8-Linux-X64/bin/llvm-dwarfdump \
                    LLVM-22.1.8-Linux-X64/bin/wasm-ld \
                    LLVM-22.1.8-Linux-X64/lib/liblldb.so \
                    LLVM-22.1.8-Linux-X64/lib/liblldb.so.22.1 \
                    LLVM-22.1.8-Linux-X64/lib/liblldb.so.22.1.8
                  tar -xzf "$WASI_ARCHIVE" -C "$NATIVE_ROOT"
                  "$LLVM_ROOT/bin/clang" --version | grep --fixed-strings "clang version 22.1.8"
                  "$LLVM_ROOT/bin/lldb" --version | grep --fixed-strings "lldb version 22.1.8"
                  "$LLVM_ROOT/bin/lldb-dap" --version | grep --fixed-strings "LLVM version 22.1.8"
            - name: Build pinned WAMR classic debug interpreter
              run: |
                  mkdir -p "$WAMR_ROOT"
                  git -C "$WAMR_ROOT" init
                  git -C "$WAMR_ROOT" remote add origin "$WAMR_REPOSITORY"
                  git -C "$WAMR_ROOT" fetch --depth 1 origin "$WAMR_COMMIT"
                  git -C "$WAMR_ROOT" checkout --detach FETCH_HEAD
                  test "$(git -C "$WAMR_ROOT" rev-parse HEAD)" = "$WAMR_COMMIT"
                  cmake \
                    -S "$WAMR_ROOT/product-mini/platforms/linux" \
                    -B "$WAMR_ROOT/build" \
                    -G Ninja \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DWAMR_BUILD_INTERP=1 \
                    -DWAMR_BUILD_FAST_INTERP=0 \
                    -DWAMR_BUILD_DEBUG_INTERP=1 \
                    -DWAMR_BUILD_AOT=0 \
                    -DWAMR_BUILD_JIT=0 \
                    -DWAMR_BUILD_FAST_JIT=0 \
                    -DWAMR_BUILD_LIBC_WASI=1 \
                    -DWAMR_BUILD_LIBC_BUILTIN=0 \
                    -DWAMR_BUILD_MULTI_MODULE=0 \
                    -DWAMR_BUILD_SIMD=0 \
                    -DWAMR_BUILD_MEMORY64=0 \
                    -DWAMR_BUILD_SHARED_MEMORY=0
                  cmake --build "$WAMR_ROOT/build" --parallel 2
            - name: Compile and verify the C DWARF fixture
              run: |
                  FIXTURE_ROOT="$GITHUB_WORKSPACE/test/native-wasm-debug"
                  "$LLVM_ROOT/bin/clang" \
                    --target=wasm32-wasi \
                    --sysroot="$WASI_ROOT/share/wasi-sysroot" \
                    -resource-dir="$WASI_ROOT/lib/clang/22" \
                    -g \
                    -O0 \
                    -fstandalone-debug \
                    -fdebug-compilation-dir=/workspace \
                    -ffile-prefix-map="$FIXTURE_ROOT=/workspace" \
                    "$FIXTURE_ROOT/main.c" \
                    -o "$PROGRAM_PATH"
                  echo "$C_FIXTURE_SHA256  $PROGRAM_PATH" | sha256sum --check
                  "$LLVM_ROOT/bin/llvm-dwarfdump" --verify "$PROGRAM_PATH"
                  "$LLVM_ROOT/bin/llvm-dwarfdump" --debug-info "$PROGRAM_PATH" |
                    grep --fixed-strings "/workspace/main.c"
                  "$LLVM_ROOT/bin/clang" \
                    --target=wasm32-wasi \
                    --sysroot="$WASI_ROOT/share/wasi-sysroot" \
                    -resource-dir="$WASI_ROOT/lib/clang/22" \
                    -g \
                    -O0 \
                    -fstandalone-debug \
                    -fdebug-compilation-dir=/workspace \
                    -ffile-prefix-map="$FIXTURE_ROOT=/workspace" \
                    "$FIXTURE_ROOT/trap.c" \
                    -o "$TRAP_PROGRAM_PATH"
                  echo "$TRAP_FIXTURE_SHA256  $TRAP_PROGRAM_PATH" | sha256sum --check
                  "$LLVM_ROOT/bin/llvm-dwarfdump" --verify "$TRAP_PROGRAM_PATH"
                  "$LLVM_ROOT/bin/llvm-dwarfdump" --debug-info "$TRAP_PROGRAM_PATH" |
                    grep --fixed-strings "/workspace/trap.c"
                  "$LLVM_ROOT/bin/clang" \
                    --target=wasm32-wasi \
                    --sysroot="$WASI_ROOT/share/wasi-sysroot" \
                    -resource-dir="$WASI_ROOT/lib/clang/22" \
                    -g \
                    -O0 \
                    -fstandalone-debug \
                    -fdebug-compilation-dir=/workspace \
                    -ffile-prefix-map="$FIXTURE_ROOT=/workspace" \
                    "$FIXTURE_ROOT/interrupt.c" \
                    -o "$INTERRUPT_PROGRAM_PATH"
                  echo "$INTERRUPT_FIXTURE_SHA256  $INTERRUPT_PROGRAM_PATH" | sha256sum --check
                  "$LLVM_ROOT/bin/llvm-dwarfdump" --verify "$INTERRUPT_PROGRAM_PATH"
                  "$LLVM_ROOT/bin/llvm-dwarfdump" --debug-info "$INTERRUPT_PROGRAM_PATH" |
                    grep --fixed-strings "/workspace/interrupt.c"
            - name: Prepare clean pinned native feature sources
              run: |
                  test ! -e "$NATIVE_FEATURE_ROOT"
                  mkdir -p "$NATIVE_FEATURE_ROOT"
                  git init "$NATIVE_FEATURE_SOURCE"
                  git -C "$NATIVE_FEATURE_SOURCE" remote add origin https://github.com/llvm/llvm-project.git
                  git -C "$NATIVE_FEATURE_SOURCE" fetch --depth 1 origin ca7933e47d3a3451d81e72ac174dcb5aa28b59d1
                  git -C "$NATIVE_FEATURE_SOURCE" checkout --detach FETCH_HEAD
                  node --input-type=module <<'NODE'
                  import assert from 'node:assert/strict';
                  import { createHash } from 'node:crypto';
                  import fs from 'node:fs/promises';
                  import path from 'node:path';
                  import { execFileSync } from 'node:child_process';
                  import { verifyLockedInputs } from './producer/lldb-browser/scripts/contracts.mjs';
                  const digest = bytes => createHash('sha256').update(bytes).digest('hex');
                  const clangBytes = await fs.readFile('producer/clang-browser/manifest.json');
                  const lockBytes = await fs.readFile('producer/lldb-browser/sources.lock.json');
                  const clang = JSON.parse(clangBytes);
                  const lock = JSON.parse(lockBytes);
                  await verifyLockedInputs(lock);
                  const source = process.env.NATIVE_FEATURE_SOURCE;
                  const git = (...args) => execFileSync('git', ['-C', source, ...args], { encoding: 'utf8' }).trim();
                  const revision = git('rev-parse', 'HEAD');
                  assert.equal(revision, lock.llvm.commit);
                  assert.equal(revision, clang.sources.llvm.commit);
                  assert.equal(git('status', '--porcelain'), '');
                  const wasmPatches = ['0007-wasm-recursive-frame-cfa.patch', '0010-wasm-caller-pc-cache.patch',
                    '0011-libcxx-container-adaptors.patch', '0012-lldb-dap-clear-hit-condition.patch'];
                  const patches = [
                    { root: 'producer/clang-browser', ...clang.sources.wasmFunctionEndPatch },
                    ...wasmPatches.map(name => {
                      const spec = lock.patches.find(spec => spec.path === `patches/${name}`);
                      assert.ok(spec, `native feature patch must be locked: ${name}`);
                      return { root: 'producer/lldb-browser', ...spec };
                    })
                  ];
                  for (const patch of patches) {
                    const file = path.resolve(patch.root, patch.path);
                    assert.equal(digest(await fs.readFile(file)), patch.sha256);
                    git('apply', '--check', file);
                    git('apply', file);
                  }
                  git('diff', '--check');
                  const qualificationInputs = {};
                  for (const file of ['function-end.cpp', 'hit-count.c', 'container-adaptors.cpp',
                    'run-native-cpp-baseline.mjs', 'run-native-hit-condition-baseline.mjs',
                    'run-native-dap-baseline.mjs', 'native-processes.mjs']) {
                    const bytes = await fs.readFile(`test/native-wasm-debug/${file}`);
                    qualificationInputs[file] = { bytes: bytes.length, sha256: digest(bytes) };
                  }
                  await fs.writeFile(path.join(process.env.NATIVE_FEATURE_ROOT, 'source-inputs.json'),
                    JSON.stringify({ revision, qualificationCommit: process.env.GITHUB_SHA,
                      qualificationInputs, clangManifestSha256: digest(clangBytes),
                      lldbSourcesLockSha256: digest(lockBytes), patches,
                      trackedDiffSha256: digest(git('diff', '--binary', '--full-index')) }, null, 2) + '\n');
                  NODE
            - name: Build patched native Clang and LLDB without cached objects
              run: |
                  df -h "$NATIVE_ROOT"
                  test ! -e "$NATIVE_FEATURE_BUILD"
                  cmake -S "$NATIVE_FEATURE_SOURCE/llvm" -B "$NATIVE_FEATURE_BUILD" -G Ninja \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DLLVM_ENABLE_PROJECTS='clang;lldb' \
                    -DLLVM_TARGETS_TO_BUILD=WebAssembly \
                    -DLLVM_USE_LINKER=lld -DLLVM_PARALLEL_LINK_JOBS=1 \
                    -DLLVM_INCLUDE_TESTS=OFF -DCLANG_INCLUDE_TESTS=OFF -DLLDB_INCLUDE_TESTS=OFF \
                    -DLLVM_INCLUDE_DOCS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF \
                    -DLLDB_ENABLE_PYTHON=OFF -DLLDB_ENABLE_LUA=OFF -DLLDB_ENABLE_SWIG=OFF \
                    -DLLDB_ENABLE_LIBEDIT=OFF -DLLDB_ENABLE_CURSES=OFF -DLLDB_ENABLE_LZMA=OFF \
                    -DLLDB_ENABLE_LIBXML2=ON -DLLDB_ENABLE_PROTOCOL_SERVERS=OFF \
                    -DLLDB_BUILD_LLDBRPC=OFF -DLLVM_ENABLE_ASSERTIONS=OFF
                  cmake --build "$NATIVE_FEATURE_BUILD" --target clang lldb lldb-dap --parallel 2
                  sha256sum "$NATIVE_FEATURE_BUILD/bin/clang" \
                    "$NATIVE_FEATURE_BUILD/bin/lldb" "$NATIVE_FEATURE_BUILD/bin/lldb-dap" "$WAMR_ROOT/build/iwasm" \
                    "$NATIVE_FEATURE_BUILD/lib/liblldb.so" \
                    > "$NATIVE_FEATURE_ROOT/built-binaries.sha256"
                  df -h "$NATIVE_ROOT"
            - name: Compile and verify debugger feature fixtures with patched Clang
              run: |
                  FIXTURE_ROOT="$GITHUB_WORKSPACE/test/native-wasm-debug"
                  FEATURE_CPP_HEADERS="$WASI_ROOT/share/wasi-sysroot/include/wasm32-wasip1/noeh/c++/v1"
                  FEATURE_CPP_LIBS="$WASI_ROOT/share/wasi-sysroot/lib/wasm32-wasip1/noeh"
                  test -f "$FEATURE_CPP_HEADERS/deque"
                  test -f "$FEATURE_CPP_LIBS/libc++.a"
                  test -f "$FEATURE_CPP_LIBS/libc++abi.a"
                  "$NATIVE_FEATURE_BUILD/bin/clang" \
                    --target=wasm32-wasi \
                    -fuse-ld="$LLVM_ROOT/bin/wasm-ld" \
                    --sysroot="$WASI_ROOT/share/wasi-sysroot" \
                    -resource-dir="$WASI_ROOT/lib/clang/22" \
                    -g -O0 -fstandalone-debug \
                    -fdebug-compilation-dir=/workspace \
                    -ffile-prefix-map="$FIXTURE_ROOT=/workspace" \
                    "$FIXTURE_ROOT/hit-count.c" -o "$HIT_COUNT_PROGRAM_PATH"
                  "$LLVM_ROOT/bin/llvm-dwarfdump" --verify "$HIT_COUNT_PROGRAM_PATH"
                  "$NATIVE_FEATURE_BUILD/bin/clang" --driver-mode=g++ \
                    --target=wasm32-wasi \
                    -fuse-ld="$LLVM_ROOT/bin/wasm-ld" \
                    -stdlib=libc++ -fno-exceptions -nostdinc++ \
                    -isystem "$FEATURE_CPP_HEADERS" -L"$FEATURE_CPP_LIBS" \
                    --sysroot="$WASI_ROOT/share/wasi-sysroot" \
                    -resource-dir="$WASI_ROOT/lib/clang/22" \
                    -g -O0 -fstandalone-debug \
                    -fdebug-compilation-dir=/workspace \
                    -ffile-prefix-map="$FIXTURE_ROOT=/workspace" \
                    "$FIXTURE_ROOT/function-end.cpp" -o "$FUNCTION_END_PROGRAM_PATH"
                  "$LLVM_ROOT/bin/llvm-dwarfdump" --verify "$FUNCTION_END_PROGRAM_PATH"
                  "$NATIVE_FEATURE_BUILD/bin/clang" --driver-mode=g++ \
                    --target=wasm32-wasi \
                    -fuse-ld="$LLVM_ROOT/bin/wasm-ld" \
                    -stdlib=libc++ -fno-exceptions -nostdinc++ \
                    -isystem "$FEATURE_CPP_HEADERS" -L"$FEATURE_CPP_LIBS" \
                    --sysroot="$WASI_ROOT/share/wasi-sysroot" \
                    -resource-dir="$WASI_ROOT/lib/clang/22" \
                    -g -O0 -fstandalone-debug \
                    -fdebug-compilation-dir=/workspace \
                    -ffile-prefix-map="$FIXTURE_ROOT=/workspace" \
                    "$FIXTURE_ROOT/container-adaptors.cpp" -o "$CONTAINER_ADAPTORS_PROGRAM_PATH"
                  "$LLVM_ROOT/bin/llvm-dwarfdump" --verify "$CONTAINER_ADAPTORS_PROGRAM_PATH"
                  sha256sum "$HIT_COUNT_PROGRAM_PATH" "$FUNCTION_END_PROGRAM_PATH" \
                    "$CONTAINER_ADAPTORS_PROGRAM_PATH" > "$NATIVE_FEATURE_ROOT/fixture-modules.sha256"
            - name: Run native function-end baseline with patched binaries
              run: |
                  node test/native-wasm-debug/run-native-cpp-baseline.mjs \
                    --iwasm "$WAMR_ROOT/build/iwasm" \
                    --lldb "$NATIVE_FEATURE_BUILD/bin/lldb" \
                    --program "$FUNCTION_END_PROGRAM_PATH" --kind function-end \
                    > "$NATIVE_FEATURE_ROOT/function-end.log"
            - name: Qualify native libc++ container adaptors with patched binaries
              run: |
                  node test/native-wasm-debug/run-native-cpp-baseline.mjs \
                    --iwasm "$WAMR_ROOT/build/iwasm" \
                    --lldb "$NATIVE_FEATURE_BUILD/bin/lldb" \
                    --program "$CONTAINER_ADAPTORS_PROGRAM_PATH" --kind container-adaptors \
                    > "$NATIVE_FEATURE_ROOT/container-adaptors.log"
            - name: Qualify DAP hit conditions and both clearing forms with patched LLDB
              run: |
                  node test/native-wasm-debug/run-native-hit-condition-baseline.mjs \
                    --iwasm "$WAMR_ROOT/build/iwasm" \
                    --lldb-dap "$NATIVE_FEATURE_BUILD/bin/lldb-dap" \
                    --program "$HIT_COUNT_PROGRAM_PATH" --case all \
                    > "$NATIVE_FEATURE_ROOT/hit-condition.json"
                  sha256sum --check "$NATIVE_FEATURE_ROOT/built-binaries.sha256"
                  sha256sum --check "$NATIVE_FEATURE_ROOT/fixture-modules.sha256"
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: native-debugger-qualification-${{ github.sha }}
                  path: |
                      /tmp/wasm-native-debug/features/source-inputs.json
                      /tmp/wasm-native-debug/features/built-binaries.sha256
                      /tmp/wasm-native-debug/features/fixture-modules.sha256
                      /tmp/wasm-native-debug/features/function-end.log
                      /tmp/wasm-native-debug/features/container-adaptors.log
                      /tmp/wasm-native-debug/features/hit-condition.json
                  if-no-files-found: warn
                  retention-days: 7
            - name: Run native LLDB command baseline
              run: |
                  node test/native-wasm-debug/run-native-baseline.mjs \
                    --iwasm "$WAMR_ROOT/build/iwasm" \
                    --lldb "$LLVM_ROOT/bin/lldb" \
                    --program "$PROGRAM_PATH"
            - name: Run native LLDB DAP baseline
              run: |
                  node test/native-wasm-debug/run-native-dap-baseline.mjs \
                    --iwasm "$WAMR_ROOT/build/iwasm" \
                    --lldb-dap "$LLVM_ROOT/bin/lldb-dap" \
                    --program "$PROGRAM_PATH" \
                    --repeat 10
            - name: Run native LLDB DAP trap baseline
              run: |
                  node test/native-wasm-debug/run-native-dap-baseline.mjs \
                    --iwasm "$WAMR_ROOT/build/iwasm" \
                    --lldb-dap "$LLVM_ROOT/bin/lldb-dap" \
                    --program "$TRAP_PROGRAM_PATH" \
                    --scenario trap
            - name: Run native LLDB DAP interrupt baseline
              run: |
                  node test/native-wasm-debug/run-native-dap-baseline.mjs \
                    --iwasm "$WAMR_ROOT/build/iwasm" \
                    --lldb-dap "$LLVM_ROOT/bin/lldb-dap" \
                    --program "$INTERRUPT_PROGRAM_PATH" \
                    --scenario interrupt
