name: Swift browser compiler producer

on:
    workflow_dispatch:
        inputs:
            swift_ref:
                description: Swift branch, tag, or commit to clone when bootstrap_source is true
                required: false
                default: swift-6.3.3-RELEASE
            swift_clone_depth:
                description: Optional shallow clone depth for the initial swift.git clone
                required: false
            swift_clone_filter:
                description: Optional partial clone filter for the initial swift.git clone, for example blob:none
                required: false
            dependency_scheme:
                description: swift/utils/update-checkout dependency scheme
                required: false
                default: release/6.3
            bootstrap_source:
                description: Run the large Swift source checkout step
                required: true
                type: boolean
                default: false
            allow_existing_checkout:
                description: Reuse an existing source checkout in the runner workspace
                required: true
                type: boolean
                default: true
            min_free_gib:
                description: Minimum free GiB required for large Swift checkout and build steps
                required: true
                default: "80"
            checkout_root:
                description: Optional existing Swift source checkout root; required when bootstrap_source is false
                required: false
            source_bootstrap_receipt:
                description: Passed source bootstrap receipt for checkout_root when bootstrap_source is false
                required: false
            browser_build_command:
                description: Required shell command that produces runner-worker.js, swiftc.wasm, and swiftpm.wasm before verification
                required: true
            runner_worker:
                description: Optional path to runner-worker.js produced by an external browser compiler build
                required: false
            swiftc_wasm:
                description: Optional path to swiftc.wasm produced by an external browser compiler build
                required: false
            swiftpm_wasm:
                description: Optional path to swiftpm.wasm produced by an external browser compiler build
                required: false
            sdk_archive:
                description: Optional path to sdk.tar.gz; leave empty to use the documented official SDK artifact
                required: false
            swift_version:
                description: Swift version recorded in runtime-build.json
                required: true
                default: 6.3.3
            wasm_sdk_id:
                description: Wasm SDK id recorded in runtime-build.json
                required: true
                default: swift-6.3.3-RELEASE_wasm
            published_url:
                description: Optional final URL where the exported archive will be published
                required: false

jobs:
    export-runtime:
        runs-on: ubuntu-latest
        timeout-minutes: 360
        # GitHub-hosted jobs have a six-hour execution limit. Longer builds
        # require separately verified stages or an explicitly managed runner.
        env:
            SWIFT_INPUT_ALLOW_EXISTING_CHECKOUT: ${{ inputs.allow_existing_checkout }}
            SWIFT_INPUT_BOOTSTRAP_SOURCE: ${{ inputs.bootstrap_source }}
            SWIFT_INPUT_BROWSER_BUILD_COMMAND: ${{ inputs.browser_build_command }}
            SWIFT_INPUT_CHECKOUT_ROOT: ${{ inputs.checkout_root }}
            SWIFT_INPUT_DEPENDENCY_SCHEME: ${{ inputs.dependency_scheme }}
            SWIFT_INPUT_MIN_FREE_GIB: ${{ inputs.min_free_gib }}
            SWIFT_INPUT_PUBLISHED_URL: ${{ inputs.published_url }}
            SWIFT_INPUT_RUNNER_WORKER: ${{ inputs.runner_worker }}
            SWIFT_INPUT_SDK_ARCHIVE: ${{ inputs.sdk_archive }}
            SWIFT_INPUT_SOURCE_BOOTSTRAP_RECEIPT: ${{ inputs.source_bootstrap_receipt }}
            SWIFT_INPUT_SWIFT_CLONE_DEPTH: ${{ inputs.swift_clone_depth }}
            SWIFT_INPUT_SWIFT_CLONE_FILTER: ${{ inputs.swift_clone_filter }}
            SWIFT_INPUT_SWIFT_REF: ${{ inputs.swift_ref }}
            SWIFT_INPUT_SWIFT_VERSION: ${{ inputs.swift_version }}
            SWIFT_INPUT_SWIFTC_WASM: ${{ inputs.swiftc_wasm }}
            SWIFT_INPUT_SWIFTPM_WASM: ${{ inputs.swiftpm_wasm }}
            SWIFT_INPUT_WASM_SDK_ID: ${{ inputs.wasm_sdk_id }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm exec playwright-core install --with-deps chromium

            - name: Prepare workflow paths
              run: node producer/swift-browser/scripts/workflow-paths.mjs

            - name: Preflight workflow inputs
              run: |
                  pnpm --dir producer/swift-browser run workflow:preflight -- \
                    --bootstrap-source "$SWIFT_INPUT_BOOTSTRAP_SOURCE" \
                    --source-root "$WASM_SWIFT_SOURCE_ROOT" \
                    --source-bootstrap-receipt "$WASM_SWIFT_BOOTSTRAP_RECEIPT" \
                    --build-dir "$WASM_SWIFT_BUILD_DIR" \
                    --min-free-gib "$SWIFT_INPUT_MIN_FREE_GIB" \
                    --swift-clone-depth "$SWIFT_INPUT_SWIFT_CLONE_DEPTH" \
                    --swift-clone-filter "$SWIFT_INPUT_SWIFT_CLONE_FILTER" \
                    --runner-worker "$SWIFT_INPUT_RUNNER_WORKER" \
                    --swiftc-wasm "$SWIFT_INPUT_SWIFTC_WASM" \
                    --swiftpm-wasm "$SWIFT_INPUT_SWIFTPM_WASM" \
                    --sdk-archive "$SWIFT_INPUT_SDK_ARCHIVE" \
                    --browser-build-command "$SWIFT_INPUT_BROWSER_BUILD_COMMAND" \
                    --swift-version "$SWIFT_INPUT_SWIFT_VERSION" \
                    --wasm-sdk-id "$SWIFT_INPUT_WASM_SDK_ID" \
                    --published-url "$SWIFT_INPUT_PUBLISHED_URL" \
                    --receipt "$WASM_SWIFT_WORKFLOW_PREFLIGHT_RECEIPT"

            - name: Probe native Swift/Wasm baseline
              run: |
                  pnpm --dir producer/swift-browser run probe:toolchain -- \
                    --run-wasm \
                    --receipt "$RUNNER_TEMP/wasm-swift-toolchain-probe.json"

            - name: Bootstrap Swift source checkout
              if: ${{ inputs.bootstrap_source }}
              run: |
                  ARGS=(
                    --source-root "$WASM_SWIFT_SOURCE_ROOT"
                    --swift-ref "$SWIFT_INPUT_SWIFT_REF"
                    --dependency-scheme "$SWIFT_INPUT_DEPENDENCY_SCHEME"
                    --min-free-gib "$SWIFT_INPUT_MIN_FREE_GIB"
                    --receipt "$WASM_SWIFT_BOOTSTRAP_RECEIPT"
                    --execute
                  )
                  if [ -n "$SWIFT_INPUT_SWIFT_CLONE_DEPTH" ]; then
                    ARGS+=(--swift-clone-depth "$SWIFT_INPUT_SWIFT_CLONE_DEPTH")
                  fi
                  if [ -n "$SWIFT_INPUT_SWIFT_CLONE_FILTER" ]; then
                    ARGS+=(--swift-clone-filter "$SWIFT_INPUT_SWIFT_CLONE_FILTER")
                  fi
                  if [ "$SWIFT_INPUT_ALLOW_EXISTING_CHECKOUT" = "true" ]; then
                    ARGS+=(--allow-existing)
                  fi
                  pnpm --dir producer/swift-browser run bootstrap:source -- "${ARGS[@]}"

            - name: Write browser compiler build plan and run build command
              run: |
                  ARGS=(
                    --checkout-root "$WASM_SWIFT_SOURCE_ROOT"
                    --build-dir "$WASM_SWIFT_BUILD_DIR"
                    --raw-runtime-dir "$WASM_SWIFT_RAW_RUNTIME_DIR"
                    --plan-path "$WASM_SWIFT_BUILD_PLAN"
                    --browser-build-log "$WASM_SWIFT_BROWSER_BUILD_LOG"
                    --allow-missing-tools
                  )
                  if [ -f "$WASM_SWIFT_BOOTSTRAP_RECEIPT" ]; then
                    ARGS+=(--source-bootstrap-receipt "$WASM_SWIFT_BOOTSTRAP_RECEIPT")
                  fi
                  if [ -n "$SWIFT_INPUT_BROWSER_BUILD_COMMAND" ]; then
                    ARGS+=(--browser-build-command "$SWIFT_INPUT_BROWSER_BUILD_COMMAND")
                    ARGS+=(--execute-browser-build-command)
                    if [ -z "$SWIFT_INPUT_RUNNER_WORKER" ] && [ -z "$SWIFT_INPUT_SWIFTC_WASM" ] && [ -z "$SWIFT_INPUT_SWIFTPM_WASM" ] && [ -z "$SWIFT_INPUT_SDK_ARCHIVE" ]; then
                      ARGS+=(--discover-build-outputs)
                    fi
                  fi
                  if [ -n "$SWIFT_INPUT_RUNNER_WORKER" ]; then
                    ARGS+=(--runner-worker "$SWIFT_INPUT_RUNNER_WORKER")
                  fi
                  if [ -n "$SWIFT_INPUT_SWIFTC_WASM" ]; then
                    ARGS+=(--swiftc-wasm "$SWIFT_INPUT_SWIFTC_WASM")
                  fi
                  if [ -n "$SWIFT_INPUT_SWIFTPM_WASM" ]; then
                    ARGS+=(--swiftpm-wasm "$SWIFT_INPUT_SWIFTPM_WASM")
                  fi
                  if [ -n "$SWIFT_INPUT_SDK_ARCHIVE" ]; then
                    ARGS+=(--sdk-archive "$SWIFT_INPUT_SDK_ARCHIVE")
                  else
                    ARGS+=(--fetch-official-sdk)
                  fi
                  pnpm --dir producer/swift-browser run build:browser-compiler -- "${ARGS[@]}"

            - name: Print browser compiler output contract
              run: |
                  {
                    echo "browser_build_command must produce the browser-hosted Swift runtime outputs below unless explicit workflow inputs override them:"
                    echo "runner-worker.js: ${WASM_SWIFT_RUNNER_WORKER}"
                    echo "swiftc.wasm: ${WASM_SWIFT_SWIFTC_WASM}"
                    echo "swiftpm.wasm: ${WASM_SWIFT_SWIFTPM_WASM}"
                    echo "sdk.tar.gz: ${WASM_SWIFT_SDK_ARCHIVE}"
                    echo "build plan: ${WASM_SWIFT_BUILD_PLAN}"
                  } | tee "$RUNNER_TEMP/wasm-swift-output-contract.txt"

            - name: Summarize browser compiler outputs
              run: |
                  {
                    for entry in \
                      "runner-worker.js:${WASM_SWIFT_RUNNER_WORKER}" \
                      "swiftc.wasm:${WASM_SWIFT_SWIFTC_WASM}" \
                      "swiftpm.wasm:${WASM_SWIFT_SWIFTPM_WASM}" \
                      "sdk.tar.gz:${WASM_SWIFT_SDK_ARCHIVE}"
                    do
                      name="${entry%%:*}"
                      file="${entry#*:}"
                      if [ -f "$file" ]; then
                        bytes="$(wc -c < "$file" | tr -d ' ')"
                        echo "${name}: present (${bytes} bytes) at ${file}"
                      else
                        echo "${name}: missing at ${file}"
                      fi
                    done
                  } | tee "$RUNNER_TEMP/wasm-swift-output-summary.txt"

            - name: Discover browser compiler outputs
              if: ${{ inputs.runner_worker == '' && inputs.swiftc_wasm == '' && inputs.swiftpm_wasm == '' && inputs.sdk_archive == '' }}
              run: |
                  pnpm --dir producer/swift-browser run discover:build-outputs -- \
                    --build-dir "$WASM_SWIFT_BUILD_DIR" \
                    --plan "$WASM_SWIFT_BUILD_PLAN" \
                    --allow-official-sdk-placeholder \
                    --write-plan

            - name: Run upstream Swift/WASI baseline
              run: |
                  pnpm --dir producer/swift-browser run run:upstream-baseline -- \
                    --plan "$WASM_SWIFT_BUILD_PLAN" \
                    --min-free-gib "$SWIFT_INPUT_MIN_FREE_GIB" \
                    --preset buildbot_linux_crosscompile_wasm

            - name: Verify browser compiler outputs
              run: |
                  VERIFY_ARGS=(
                    --plan "$WASM_SWIFT_BUILD_PLAN"
                    --prepare-raw-runtime
                    --require-browser-compiler-contracts
                    --require-browser-build-command
                    --require-browser-build-execution
                    --require-browser-build-log
                    --require-source-bootstrap-provenance
                  )
                  if [ -z "$SWIFT_INPUT_SDK_ARCHIVE" ]; then
                    VERIFY_ARGS+=(--allow-official-sdk-placeholder)
                  fi
                  pnpm --dir producer/swift-browser run verify:build-outputs -- "${VERIFY_ARGS[@]}"

            - name: Package runtime from build plan
              run: |
                  PACKAGE_ARGS=(
                    --plan "$WASM_SWIFT_BUILD_PLAN"
                    --dist-dir producer/swift-browser/dist
                    --swift-version "$SWIFT_INPUT_SWIFT_VERSION"
                    --wasm-sdk-id "$SWIFT_INPUT_WASM_SDK_ID"
                    --source "GitHub Actions Swift browser producer $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                    --workflow-preflight-receipt "$WASM_SWIFT_WORKFLOW_PREFLIGHT_RECEIPT"
                    --require-upstream-baseline-receipt
                    --require-browser-compiler-contracts
                    --require-browser-build-command
                    --require-browser-build-execution
                    --require-browser-build-log
                    --require-source-bootstrap-provenance
                    --browser-contract
                  )
                  if [ -z "$SWIFT_INPUT_SDK_ARCHIVE" ]; then
                    PACKAGE_ARGS+=(--allow-official-sdk-placeholder)
                    PACKAGE_ARGS+=(--official-wasm-sdk-provenance)
                  fi
                  pnpm --dir producer/swift-browser run package:from-plan -- "${PACKAGE_ARGS[@]}"

            - name: Export runtime archive
              run: |
                  EXPORT_ARGS=(
                    --bundle-dir producer/swift-browser/dist
                    --out-dir producer/swift-browser/out
                  )
                  if [ -n "$SWIFT_INPUT_PUBLISHED_URL" ]; then
                    EXPORT_ARGS+=(--url "$SWIFT_INPUT_PUBLISHED_URL")
                  fi
                  pnpm --dir producer/swift-browser run export:runtime -- "${EXPORT_ARGS[@]}"

            - name: Write consumer integration guide
              run: |
                  {
                    echo "Upload the archive and descriptor to external static hosting, then configure the consumer with those URLs."
                  } | tee producer/swift-browser/out/PROMOTE.md

            - uses: actions/upload-artifact@v4
              with:
                  name: swift-browser-compiler
                  path: |
                      producer/swift-browser/out/*.tar.gz
                      producer/swift-browser/out/*.sha256
                      producer/swift-browser/out/*.json
                      producer/swift-browser/out/PROMOTE.md
                  if-no-files-found: error

            - uses: actions/upload-artifact@v4
              if: ${{ always() }}
              with:
                  name: swift-browser-compiler-diagnostics
                  path: |
                      ${{ runner.temp }}/wasm-swift-output-contract.txt
                      ${{ runner.temp }}/wasm-swift-output-summary.txt
                      ${{ env.WASM_SWIFT_WORKFLOW_PREFLIGHT_RECEIPT }}
                      ${{ runner.temp }}/wasm-swift-toolchain-probe.json
                      ${{ env.WASM_SWIFT_BROWSER_BUILD_LOG }}
                      ${{ env.WASM_SWIFT_BOOTSTRAP_RECEIPT }}
                      ${{ env.WASM_SWIFT_BUILD_PLAN }}
                      producer/swift-browser/dist/runtime-build.json
                      producer/swift-browser/dist/runtime-manifest.v1.json
                  if-no-files-found: ignore
